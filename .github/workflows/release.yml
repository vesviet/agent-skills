name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish @vesviet/agent-skills to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm >= 11.5.1 (trusted publishing CLI floor)
        run: npm install -g npm@latest
      - name: CLI tests
        run: node --test tests/npm/cli.test.mjs
      - name: Publish via OIDC trusted publishing
        run: npm publish --access public
