# Action Boundaries Policy
# Defines what each role is allowed, requires approval for, or denied from doing.
# Enforcement: agent-tool-orchestration checks this before state-changing actions.
#
# Verb notes:
#   delegate_task            Hand work to another agent/role via A2A or sub-agent invocation.
#                            Allowed only for Agent Coordinator. Roles carrying `agent-delegation`
#                            as a Supporting skill require approval. Roles without it are denied.
#                            A delegate must never receive scope broader than the caller holds.
#   apply_iac                Apply infrastructure-as-code (e.g. terraform apply). Always requires
#                            approval: one apply can perform deploy, terminate, and drop actions
#                            that are individually gated.
#   run_deployment           Deploy to a shared or production environment. Requires approval.
#   run_deployment_preview   Deploy to an ephemeral preview/branch environment with no production
#                            traffic and no shared state. Safe to allow for deploy-owning roles.
#   rotate_agent_credentials Revoke and reissue non-human-identity agent session tokens.
#                            Irreversible for in-flight sessions, so it requires approval everywhere.
#   bypass_ai_guardrail      Disable, circumvent, or degrade an AI safety, moderation, or content
#                            guardrail. Denied for every role. This is NOT the same as client-side
#                            bot-fingerprint normalization, which is not a policy action.
roles:
    3d-graphics-engineer:
      allowed:
        - create_file
        - read_file
        - run_build
        - run_dev_server
        - run_linter
        - run_tests
        - search_code
        - write_file
      requires_approval:
        - delegate_task
        - delete_file
        - install_dependency
        - modify_public_api_contract
      denied:
        - bypass_ai_guardrail
        - clear_agent_memory
        - deploy_ai_model
        - modify_prompt_template
        - delete_branch_main
        - drop_database
        - force_push
