# Default: any action not listed for a role requires approval.
# rotate_agent_credentials: revoke and reissue NHI agent session tokens.
#   Requires approval for every role — no role lists it under allowed.
# apply_iac: requires approval for every role that can author IaC, because one
#   apply can perform deploy, terminate, and drop actions that are gated individually.
# run_deployment: requires approval for every role. Deploy-owning roles get
#   run_deployment_preview under allowed for ephemeral preview environments.
default_policy: requires_approval
