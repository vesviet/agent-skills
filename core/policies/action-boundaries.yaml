# Action Boundaries Policy
# Defines what each role is allowed, requires approval for, or denied from doing.
# Enforcement: agent-tool-orchestration checks this before state-changing actions.
# Runtime hook: core/scripts/hooks/check-policy.py (text/json/sarif output, OCSF 99001 audit).
#
# 2026 coverage: 39 delivery roles x 65 action verbs. Roles that have no explicit entry for a
# given action fall through to `default_policy: requires_approval` (zero-trust fail-closed).
# Unclassified actions in infra/deploy verbs (apply_iac, drop_storage_volume, terminate_instance,
# modify_iam_policy, modify_network_topology_production, modify_payment_gateway_config,
# self_approve_iam, shipping_label_generation, delete_cloudflare_resource, run_migration,
# delete_file, modify_environment_config, modify_prompt_template, run_build, export_data)
# are now explicitly `denied` for non-owner roles per 2026 T1/T2 upgrade.
#
# Verb notes:
#   delegate_task            Hand work to another agent/role via A2A or sub-agent invocation.
#                            Allowed only for Agent Coordinator. Roles carrying `agent-delegation`
#                            as a Supporting skill require approval. Roles without it are denied.
#                            A delegate must never receive scope broader than the caller holds.
#   apply_iac                Apply infrastructure-as-code (e.g. terraform apply). Always requires
#                            approval: one apply can perform deploy, terminate, and drop actions
#                            that are individually gated.
#   run_deployment           Deploy to a shared or production environment. Requires approval.
#   run_deployment_preview   Deploy to an ephemeral preview/branch environment with no production
#                            traffic and no shared state. Safe to allow for deploy-owning roles.
#   rotate_agent_credentials Revoke and reissue non-human-identity agent session tokens.
#                            Irreversible for in-flight sessions, so it requires approval everywhere.
#   bypass_ai_guardrail      Disable, circumvent, or degrade an AI safety, moderation, or content
#                            guardrail. Denied for every role. This is NOT the same as client-side
#                            bot-fingerprint normalization, which is not a policy action.
#   export_data              Move or copy data out of the trusted boundary. Irreversible for
#                            restricted data; requires approval even for owners.
#   verify_svid_token        Cryptographic NHI SPIFFE/SVID token verification for delegation.
#   execute_stateless_mcp    Remote stateless MCP tool invocation without persistent session cookies.
#   export_data_egress       External network egress of internal datasets beyond trust perimeter.
#   load_jit_skill           Runtime JIT dynamic skill ingestion verified against index digest.
#   spill_context_disk       Writing truncated outputs (>4KB) to .agent/outputs/ (TOC).
#   emit_ocsf_audit          Emitting structured security audit events conforming to OCSF 99001.

schema_version: "2"

compliance:
  schema_version: '2'
  eu_ai_act_article_9:
    risk_tier: minimal_risk
    enforcement_date: '2026-08-02'
    review_cycle: quarterly
    human_oversight_required:
    - push_to_production
    - run_migration
    - modify_secrets
    - deploy_ai_model
    - apply_iac
    - rotate_agent_credentials
    - export_data_egress
    - load_jit_skill
    - git_push
    - run_migrations
  nist_ai_rmf:
    govern: roles structure documents who owns each action category
    map: requires_approval list = identified risk surface; denied list = unacceptable risks
    measure: audit events for every policy decision via ocsf-99001 format
    manage: real-time policy check via check-policy.py; HITL for approval-gated actions
  audit_trail:
    log_format: ocsf-99001
    retention_days: 90
    policy_check_script: core/scripts/hooks/check-policy.py
  access_control:
    default_posture: deny
    credential_type: short-lived-oidc
    signing_key_ref: env:AGENT_SIGNING_KEY
