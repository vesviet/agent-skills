# Action Boundaries Policy
# Defines what each role is allowed, requires approval for, or denied from doing.
# Enforcement: agent-tool-orchestration checks this before state-changing actions.

roles:
  agent-coordinator:
    allowed:
      - read_file
      - write_file
      - create_file
      - search_code
      - read_logs
      - run_tests
      - run_linter
      - run_build
    requires_approval:
      - delete_file
      - run_migration
      - modify_environment_config
      - install_dependency
      - run_deployment
      - export_data
    denied:
      - push_to_production
      - modify_secrets
      - drop_database
      - force_push
      - delete_branch_main

