# Action Boundaries Policy
# Defines what each role is allowed, requires approval for, or denied from doing.
# Enforcement: agent-tool-orchestration checks this before state-changing actions.
roles:
    3d-graphics-engineer:
      allowed:
        - create_file
        - read_file
        - run_build
        - run_dev_server
        - run_linter
        - run_tests
        - search_code
        - write_file
      requires_approval:
        - delete_file
        - install_dependency
        - modify_public_api_contract
      denied:
        - bypass_ai_guardrail
        - clear_agent_memory
        - deploy_ai_model
        - modify_prompt_template
        - delete_branch_main
        - drop_database
        - force_push
        - modify_environment_config
