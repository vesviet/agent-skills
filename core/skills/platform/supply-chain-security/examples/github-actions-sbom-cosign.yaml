name: Secure Build, SBOM & Keyless Signing

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write # Required for Sigstore keyless OIDC authentication

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned SHA

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        id: build-image
        uses: docker/build-push-action@ca877d9245402d1537745e0e316eab4f2b1b5631 # v6.13.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Generate CycloneDX v1.6 SBOM via Syft
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Keyless Sign Image and Attest SBOM via Cosign
        run: |
          IMAGE_URI="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          IMAGE_DIGEST="${{ steps.build-image.outputs.digest }}"
          
          # Keyless sign container image
          cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"
          
          # Attest CycloneDX SBOM to image digest
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "${IMAGE_URI}@${IMAGE_DIGEST}"
