apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend-store
  namespace: production
spec:
  provider:
    vault:
      server: "https://vault.internal.corp:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "order-service-role"
          serviceAccountRef:
            name: order-service-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-db-credentials
  namespace: production
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend-store
    kind: SecretStore
  target:
    name: order-service-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/part-of: order-processing
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.internal:5432/orders?sslmode=verify-full"
        API_SECRET_TOKEN: "{{ .api_token }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/production/orders
        property: username
    - secretKey: password
      remoteRef:
        key: database/production/orders
        property: password
    - secretKey: api_token
      remoteRef:
        key: api/keys/stripe
        property: webhook_signing_secret
