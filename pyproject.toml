[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills"
version = "5.6.0"
description = "Reusable, language-agnostic engineering skill pack for AI software delivery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "pydantic>=2.14.1",
    "filelock>=3.16.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::pytest.PytestWarning",
]
