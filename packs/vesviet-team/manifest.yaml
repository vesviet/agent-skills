schema_version: "2"

name: vesviet-team
description: Global engineering core plus Vesviet content overlay. Enforces 2026 AI-Governance, Hub-and-Spoke Topology, GEO/AEO Answer-First formatting, AI-generated content disclosure standards (FTC 2026), and Affiliate Marketing Compliance for vesviet and learn sites.
version: 4.0.0

tags:
  - core
  - content
  - geo-aeo
  - hub-and-spoke
  - hugo
author: user
maintained_by: platform-team
license: MIT
homepage: https://github.com/vesviet/agent-skills

compatibility:
  min_pack_version: "4.0.0"
  max_pack_version: "5.x"
  requires_schema: "2"

includes:
  - core
  - overlays/vesviet-content

capabilities:
  - content-strategy
  - content-generation
  - seo
  - geo-aeo
  - documentation
  - technical-writing
  - ai-search-optimization

data_classification: internal

activation:
  strategy: marker_first
  markers:
    - hugo.toml
    - config.toml
    - config/_default/hugo.toml
    - vesviet/
    - learn/
  glob_patterns:
    - "vesviet/content/**/*.md"
    - "learn/content/**/*.md"
    - "content/**/*.md"

governance:
  eu_ai_act_tier: minimal_risk
  audit_logging: required
  audit_format: otel-json
  retention_days: 90
  secret_handling: env_only
  human_oversight:
    required: true
    gate_actions:
      - publish_to_production
      - modify_secrets
  data_policy: core/policies/data-classification.yaml
  action_policy: core/policies/action-boundaries.yaml
  review_cadence: quarterly
