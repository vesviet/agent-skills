schema_version: "2"

name: maylanhtreotuong-team
display_name: Máy Lạnh Treo Tường Content & Engineering Team
description: High-authority content, SEO engineering, and Cloudflare Pages pack for Máy Lạnh Treo Tường (https://maylanhtreotuong.com - Vietnam HVAC knowledge & empirical review portal). Composes portable core with overlays/astro-cloudflare, overlays/maylanhtreotuong-content, and overlays/seo-publishing. Enforces TCVN 7830:2021 CSPF standards, ASHRAE 55-2023 comfort metrics, empirical hardware power/acoustic testing (Hioki 3334 & RION NL-52), 7-category strict Silo link topology, 100% AnswerFirst GEO/AEO rigor, and a 4-role multi-agent delivery swarm.
version: 5.0.0

tags:
  - core
  - content
  - seo
  - hvac
  - astro
  - cloudflare
  - geo-aeo
  - vietnam
  - engineering
author: user
maintained_by: platform-team
license: MIT
homepage: https://github.com/vesviet/agent-skills

compatibility:
  min_pack_version: "4.0.0"
  max_pack_version: "5.x"
  requires_schema: "2"

includes:
  - core
  - overlays/astro-cloudflare
  - overlays/maylanhtreotuong-content
  - overlays/seo-publishing

capabilities:
  - content-strategy
  - content-generation
  - seo
  - geo-aeo
  - hvac-engineering
  - product-catalog
  - publishing-workflow
  - empirical-content-upgrade
  - silo-internal-linking

content_focus:
  primary_roles:
    - content-writer
    - seo-analyst
    - task-planner
    - content-manager
  secondary_roles:
    - technical-writer
    - cloudflare-engineer
    - frontend-developer
    - reviewer
  drafting_skills:
    - write-maylanhtreotuong-content
    - write-article
  audit_skills:
    - optimize-seo
    - audit-content
    - audit-technical-seo
    - implement-schema-markup
  standards:
    - "maylanhtreotuong-content rules: content-schema, hvac-engineering-standards, silo-linking"
    - "seo-publishing overlay: 7-day sprint boards, GEO/AEO AI citation tracking"
  workflows:
    - publish-maylanhtreotuong-content
    - empirical-hvac-upgrade-lifecycle
    - seo-content-lifecycle
    - content-publishing
    - seo-keyword-brief

corpus:
  snapshot: "2026-09-19"
  maylanhtreotuong:
    posts: 300
    products: 72
    categories: 7
    words: 1492749
    author_personas: 14
    answerfirst_coverage: "300/300"
    anti_slop_coverage: "300/300"
    indexes:
      - maylanhtreotuong/content_audit_master_index_2026.md
      - maylanhtreotuong/MASTER_AUDIT_REPORT.md
      - maylanhtreotuong/seo_audit_report.md
      - maylanhtreotuong/plan/content-inventory-index-2027.md

data_classification: internal

activation:
  strategy: marker_first
  markers:
    - maylanhtreotuong/
    - src/data/product/
    - src/data/post/
  glob_patterns:
    - "maylanhtreotuong/src/data/**/*.md"
    - "maylanhtreotuong/src/data/**/*.mdx"
    - "src/data/product/**/*.md"
    - "src/data/post/**/*.md"

governance:
  eu_ai_act_tier: minimal_risk
  audit_logging: required
  audit_format: otel-json
  retention_days: 90
  secret_handling: env_only
  human_oversight:
    required: true
    gate_actions:
      - publish_to_production
      - modify_secrets
  data_policy: core/policies/data-classification.yaml
  action_policy: core/policies/action-boundaries.yaml
  review_cadence: quarterly
