schema_version: "2"

name: data-engineer-team
description: Global engineering core plus data engineering learning overlay for Rabity's structured 10-phase roadmap. Covers DuckDB, dbt Core 1.9 microbatch, Apache Iceberg REST Catalog, Kafka, Spark, Airflow.
version: 4.0.0

tags:
  - core
  - data
  - data-engineering
  - learning
  - dbt
  - iceberg
author: user
maintained_by: platform-team
license: MIT
homepage: https://github.com/vesviet/agent-skills

compatibility:
  min_pack_version: "4.0.0"
  max_pack_version: "5.x"
  requires_schema: "2"

includes:
  - core
  - overlays/data-engineer-rabity

capabilities:
  - data-engineering
  - etl-elt
  - pipeline-development
  - sql
  - data-architecture
  - streaming

data_classification: internal

activation:
  strategy: marker_first
  markers:
    - dbt_project.yml
    - progress.md
    - airflow/
    - requirements.txt
  glob_patterns:
    - "phase-*/**/*.py"
    - "phase-*/**/*.sql"
    - "dags/**/*.py"
    - "**/*.ipynb"

governance:
  eu_ai_act_tier: minimal_risk
  audit_logging: required
  audit_format: otel-json
  retention_days: 90
  secret_handling: env_only
  human_oversight:
    required: true
    gate_actions:
      - modify_production_data
      - deploy_pipeline
  data_policy: core/policies/data-classification.yaml
  action_policy: core/policies/action-boundaries.yaml
  review_cadence: quarterly
