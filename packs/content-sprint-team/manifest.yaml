schema_version: "2"

name: content-sprint-team
description: Global engineering core plus SEO publishing sprint cadence overlay for generic dual-site sprints. Covers 2026 GEO/AEO standards, AI Overviews citation optimization, publishing cadence runbook.
version: 4.0.0

tags:
  - core
  - content
  - seo
  - geo-aeo
author: user
maintained_by: platform-team
license: MIT
homepage: https://github.com/vesviet/agent-skills

compatibility:
  min_pack_version: "4.0.0"
  max_pack_version: "5.x"
  requires_schema: "2"

includes:
  - core
  - overlays/seo-publishing

capabilities:
  - content-strategy
  - content-generation
  - seo
  - geo-aeo
  - publishing-workflow
  - ai-search-optimization

data_classification: internal

activation:
  strategy: marker_first
  markers:
    - content/
    - src/data/
    - publish-log.md
    - topic-board.md
  glob_patterns:
    - "content/**/*.md"
    - "content/**/*.mdx"
    - "src/data/**/*.md"

governance:
  eu_ai_act_tier: minimal_risk
  audit_logging: required
  audit_format: otel-json
  retention_days: 90
  secret_handling: env_only
  human_oversight:
    required: true
    gate_actions:
      - publish_to_production
      - modify_secrets
  data_policy: core/policies/data-classification.yaml
  action_policy: core/policies/action-boundaries.yaml
  review_cadence: quarterly
